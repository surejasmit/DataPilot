services:
  postgres:
    image: postgres:16-alpine
    container_name: datapilot-postgres
    environment:
      POSTGRES_DB: sem5_project
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Backend/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: datapilot-ml-service
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - NODE_API_URL=http://backend:5000/api
      - LOG_LEVEL=INFO
    volumes:
      - ./ml-service:/app
      - ./Backend/uploads:/app/uploads
      - /app/__pycache__
      - pip_cache:/root/.cache/pip
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: datapilot-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=sem5_project
      - DB_USER=postgres
      - DB_PASSWORD=123456
      - JWT_SECRET=9187e11e337edd9165b24b505403cfaf1eb711b2c9c02d3869ad31ed251db3a44fec2b9dc8331d6c60be24f4b6bcd4a555c0c0434916c2f11efa9e844afeaa98
      - PYTHON_SERVICE_URL=http://ml-service:8000/api/v1
    volumes:
      - ./Backend:/app
      - ./Backend/uploads:/app/uploads
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started
    command: npm run dev

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: datapilot-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started
    command: npm run dev

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
  pip_cache: